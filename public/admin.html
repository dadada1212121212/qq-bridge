<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>QQ 桥接 · 管理后台</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem('qq-admin-theme');
    var dark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#f5f7fb; --bg-grad1:#eef3ff; --bg-grad2:#f7f2ff;
  --surface:#ffffff; --surface-2:#f7f9fd; --surface-3:#eef2fa;
  --border:#e6ebf5; --border-strong:#d7dfee;
  --text:#111827; --text-2:#4b5563; --muted:#8792a6;
  --accent:#4d6bfe; --accent-2:#7c9bff; --accent-soft:#edf1ff;
  --ok:#16a34a; --ok-soft:#e9f9ef; --warn:#d97706; --warn-soft:#fef5e7; --err:#dc2626; --err-soft:#fdeeee;
  --radius:18px; --radius-sm:12px; --radius-xs:9px;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 10px 30px rgba(17,24,39,.06);
  --shadow-lg:0 24px 60px rgba(38,58,130,.16);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#0e1117; --bg-grad1:#131a2b; --bg-grad2:#1a1426;
  --surface:#171b24; --surface-2:#1d222d; --surface-3:#232936;
  --border:#262c39; --border-strong:#333b4c;
  --text:#eef1f7; --text-2:#b6bed0; --muted:#8b94a8;
  --accent:#6d86ff; --accent-2:#93a9ff; --accent-soft:#1e2538;
  --ok:#4ade80; --ok-soft:#14261b; --warn:#fbbf24; --warn-soft:#2a2212; --err:#f87171; --err-soft:#2b1517;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35);
  --shadow-lg:0 24px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  color:var(--text);font:14px/1.6 "Inter","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1200px 600px at 12% -10%, var(--bg-grad1), transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, var(--bg-grad2), transparent 55%),
    var(--bg);
  background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
#shell{display:flex;min-height:100vh}
#sidebar{
  width:236px;flex:0 0 236px;position:sticky;top:0;height:100vh;overflow:auto;
  padding:22px 14px;background:color-mix(in srgb, var(--surface) 82%, transparent);
  border-right:1px solid var(--border);backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}
.brand .mark{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(140deg,var(--accent),#8fb0ff);box-shadow:0 8px 20px rgba(77,107,254,.35);
}
.brand b{display:block;font-size:15px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.4px}
.nav-group{padding:14px 8px 6px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;margin:2px 0;border:0;border-radius:12px;
  background:transparent;color:var(--text-2);cursor:pointer;text-align:left;transition:.16s;
}
.nav-item .ico{width:20px;text-align:center;font-size:15px;opacity:.9}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff;box-shadow:0 10px 22px rgba(77,107,254,.32)}
.nav-item.active .ico{opacity:1}
#main{flex:1 1 auto;min-width:0;padding:26px 32px 72px;max-width:1240px}
#topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
#page-title{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
#page-sub{color:var(--muted);font-size:12.5px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12px;
  background:var(--surface);border:1px solid var(--border);color:var(--text-2);box-shadow:var(--shadow);
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 3px color-mix(in srgb,var(--muted) 18%,transparent)}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.dot.err{background:var(--err);box-shadow:0 0 0 3px var(--err-soft)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:11px;border:1px solid transparent;
  background:var(--accent);color:#fff;font-weight:600;cursor:pointer;transition:.16s;box-shadow:0 8px 18px rgba(77,107,254,.24);
}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border-strong);box-shadow:var(--shadow)}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{background:var(--err);box-shadow:0 8px 18px rgba(220,38,38,.22)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.card>h3{margin:0 0 4px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card>h3 .tag{font-weight:500;font-size:11.5px;color:var(--muted);background:var(--surface-3);padding:2px 8px;border-radius:999px}
.card .desc{color:var(--muted);font-size:12.5px;margin:2px 0 14px}
.hero{
  position:relative;overflow:hidden;border-radius:22px;padding:26px 28px;margin-bottom:18px;color:#fff;
  background:linear-gradient(118deg,#3f5ef4 0%,#4d6bfe 42%,#7c9bff 100%);box-shadow:var(--shadow-lg);
}
.hero:after{
  content:"";position:absolute;right:-90px;top:-120px;width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.5),rgba(255,255,255,0) 62%);
}
.hero .who{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hero .avatar{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:26px;backdrop-filter:blur(6px)}
.hero h2{margin:0;font-size:21px;letter-spacing:-.01em}
.hero .meta{opacity:.86;font-size:12.5px;margin-top:2px}
.hero .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-top:22px;position:relative;z-index:1}
.hero .stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px 14px;backdrop-filter:blur(6px)}
.hero .stat .k{font-size:11.5px;opacity:.8;letter-spacing:.04em}
.hero .stat .v{font-size:20px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px}
.kv .k{color:var(--muted)}
.kv .v{word-break:break-all}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{color:var(--muted);font-weight:600;font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface-2)}
.item .grow{flex:1 1 auto;min-width:0}
.item .t{font-weight:600;font-size:13px}
.item .s{color:var(--muted);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--text-2)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.err{background:var(--err-soft);color:var(--err)}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-2);min-width:150px;flex:1 1 190px}
input,select,textarea{
  width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface-2);
  color:var(--text);outline:none;transition:.16s;font-size:13px;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent);background:var(--surface)}
textarea{min-height:92px;resize:vertical;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.hint{color:var(--muted);font-size:12px}
.mono{font-family:var(--mono);font-size:12px}
pre.output{margin:0;padding:12px 14px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border);font-family:var(--mono);font-size:12px;max-height:320px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding:8px 2px 0}
.chart .bar{flex:1 1 0;min-width:3px;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,var(--accent-2),var(--accent));opacity:.9}
.chart .bar:hover{opacity:1}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 30%,transparent);border-top-color:var(--accent);animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.toast-wrap{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:10px;z-index:60}
.toast{padding:12px 16px;border-radius:13px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);font-size:13px;max-width:380px;animation:in .2s ease}
.toast.ok{border-left:4px solid var(--ok)}
.toast.err{border-left:4px solid var(--err)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#gate{position:fixed;inset:0;display:none;place-items:center;background:rgba(12,18,36,.5);backdrop-filter:blur(6px);z-index:80}
#gate.show{display:grid}
#gate .box{width:min(420px,90vw);background:var(--surface);border-radius:22px;padding:26px;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
#gate h2{margin:0 0 4px;font-size:18px}
.split{display:grid;gap:16px;grid-template-columns:minmax(260px,1fr) minmax(0,1.6fr)}
@media (max-width:900px){.split{grid-template-columns:1fr}}
@media (max-width:820px){
  #shell{flex-direction:column}
  #sidebar{width:100%;flex:0 0 auto;height:auto;position:static;display:flex;flex-wrap:wrap;gap:6px;padding:12px}
  .brand,padding{width:100%}
  .nav-group{display:none}
  .nav-item{width:auto}
  #main{padding:18px 16px 60px}
}
.fhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px;position:sticky;top:0;z-index:6;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding:6px 0 10px}
.ftabs{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto}
.ftab{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;font-size:12.5px;transition:.15s;box-shadow:var(--shadow)}
.ftab:hover{background:var(--surface-3);color:var(--text)}
.ftab.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(77,107,254,.28)}
.ftab b{font-weight:600;font-size:11px;background:rgba(127,127,127,.16);padding:1px 6px;border-radius:999px}
.ftab.active b{background:rgba(255,255,255,.24)}
.fsearch{flex:0 0 220px}
.fsearch input{width:100%;padding:8px 12px;border-radius:999px}
.fbar{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:12px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);position:sticky;top:52px;z-index:5}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.frow{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);min-width:0}
.ftext{flex:1 1 auto;min-width:0}
.flabel{font-size:13px;font-weight:500;line-height:1.35}
.fpath{font-size:10.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow input[type=number]{width:88px;padding:6px 9px;font-size:12.5px}
.frow input[type=text]{width:150px;padding:6px 9px;font-size:12.5px}
.frow select{width:104px;padding:6px 9px;font-size:12.5px}
.switch{position:relative;display:inline-block;width:42px;height:23px;flex:0 0 42px;cursor:pointer}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;border-radius:999px;background:color-mix(in srgb,var(--muted) 32%,transparent);transition:.16s}
.slider:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider:before{transform:translateX(19px)}
.switch input:focus-visible + .slider{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
@media (max-width:900px){.fsearch{flex:1 1 100%}.fbar{position:static}}
</style>
</head>
<body>
<div id="gate"><div class="box">
  <h2>连接后台</h2>
  <p class="hint" style="margin:0 0 14px">请输入控制台令牌（config.json 里的 consoleToken）。只存在本机浏览器里。</p>
  <input id="gate-token" type="password" placeholder="consoleToken" autocomplete="off">
  <div class="row" style="margin-top:14px"><button class="btn" id="gate-ok">进入后台</button><span class="hint" id="gate-msg"></span></div>
</div></div>
<div id="shell">
  <aside id="sidebar">
    <div class="brand"><div class="mark">🐋</div><div><b>QQ 桥接后台</b><small>DeepSeek Harness</small></div></div>
    <div class="nav-group">监控</div>
    <button class="nav-item active" data-view="overview"><span class="ico">◎</span>总览</button>
    <button class="nav-item" data-view="sessions"><span class="ico">☷</span>会话与唤醒</button>
    <button class="nav-item" data-view="usage"><span class="ico">◔</span>用量与花费</button>
    <div class="nav-group">内容</div>
    <button class="nav-item" data-view="kb"><span class="ico">▤</span>知识库</button>
    <button class="nav-item" data-view="memes"><span class="ico">☻</span>表情包仓库</button>
    <button class="nav-item" data-view="memory"><span class="ico">◈</span>记忆</button>
    <button class="nav-item" data-view="persona"><span class="ico">☺</span>人格与提示词</button>
    <div class="nav-group">设置</div>
    <button class="nav-item" data-view="features"><span class="ico">◉</span>功能开关</button>
    <button class="nav-item" data-view="plugins"><span class="ico">⧉</span>插件</button>
    <button class="nav-item" data-view="cfgfiles"><span class="ico">⇪</span>配置文件</button>
    <button class="nav-item" data-view="costs"><span class="ico">¥</span>成本账本</button>
    <button class="nav-item" data-view="bili"><span class="ico">🐟</span>B 站养鱼</button>
    <button class="nav-item" data-view="settings"><span class="ico">⚙</span>白名单与安全</button>
    <button class="nav-item" data-view="runtime"><span class="ico">⚡</span>省 token 与速度</button>
    <button class="nav-item" data-view="ops"><span class="ico">✦</span>运维</button>
  </aside>
  <main id="main">
    <div id="topbar">
      <div>
        <h1 id="page-title">总览</h1>
        <div id="page-sub">—</div>
      </div>
      <div class="pills" id="pills"></div>
      <select class="btn ghost sm" id="auto-refresh" title="自动刷新间隔" style="width:auto">
        <option value="0">自动刷新：关</option>
        <option value="10">自动刷新：10s</option>
        <option value="30">自动刷新：30s</option>
        <option value="60">自动刷新：60s</option>
      </select>
      <button class="btn ghost sm" id="btn-theme">🌓 主题</button>
      <button class="btn ghost sm" id="btn-refresh">↻ 刷新</button>
    </div>
    <div id="view"><div class="empty"><span class="spin"></span> 加载中…</div></div>
  </main>
</div>
<div class="toast-wrap" id="toasts"></div>
<script>
(function () {
'use strict';
var TOKEN_KEY = 'qq-admin-token';
var THEME_KEY = 'qq-admin-theme';
var AUTO_KEY = 'qq-admin-autorefresh';
var state = { token: '', view: 'overview', status: null, tokens: null, knobs: null, sessions: [], convs: [], roles: null, kb: null, selKey: '' };
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
function n(v, d) { var x = Number(v); return isFinite(x) ? x : (d || 0); }
function money(v) { var x = n(v); return '¥' + x.toFixed(x >= 1 ? 2 : 4); }
function big(v) {
  var x = n(v);
  if (x >= 1e9) return (x / 1e9).toFixed(2) + 'B';
  if (x >= 1e6) return (x / 1e6).toFixed(2) + 'M';
  if (x >= 1e3) return (x / 1e3).toFixed(1) + 'k';
  return String(x);
}
function pct(v) { return (n(v) * 100).toFixed(1) + '%'; }
function ts(v) {
  if (!v) return '—';
  var d = new Date(typeof v === 'number' ? v : Number(v) || v);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleString('zh-CN', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function toast(msg, kind) {
  var box = document.createElement('div');
  box.className = 'toast ' + (kind || 'ok');
  box.textContent = msg;
  $('toasts').appendChild(box);
  setTimeout(function () { box.remove(); }, 4200);
}
function api(path, opts) {
  opts = opts || {};
  var init = { method: opts.method || 'GET', headers: { 'content-type': 'application/json', 'x-console-token': state.token } };
  if (opts.body !== undefined) init.body = JSON.stringify(opts.body);
  return fetch(path, init).then(function (res) {
    if (res.status === 401) { showGate('令牌无效或已更换'); throw new Error('未授权'); }
    return res.text().then(function (text) {
      var data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = { raw: text }; }
      if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
      if (data && data.ok === false) throw new Error(data.error || '接口返回 ok:false');
      return data;
    });
  });
}
// ── 令牌记忆 + 自动刷新 ────────────────────────────────────────────────
function adminCookieName() { return 'qq_admin_' + (location.port || '80'); }
function readCookie(name) {
  var m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}
function saveToken(t) {
  var ok = false;
  try { localStorage.setItem(TOKEN_KEY, t); ok = localStorage.getItem(TOKEN_KEY) === t; } catch (e) {}
  try {
    document.cookie = adminCookieName() + '=' + encodeURIComponent(t) + '; Path=/; Max-Age=2592000; SameSite=Strict';
    if (readCookie(adminCookieName()) === t) ok = true;
  } catch (e) {}
  return ok;
}
var autoTimer = null;
function autoRefreshTick() {
  if (document.visibilityState !== 'visible') return;
  var gate = $('gate');
  if (gate && gate.classList.contains('show')) return;
  var ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA')) return;
  if (state.view === 'features' && typeof featDirtyCount === 'function' && featDirtyCount() > 0) return;
  // 不整页 flash「加载中」：先静默取数，再原地重绘总览/用量；其它页有表单，只更新顶栏。

  var q = '?limit=' + MEMES.limit + '&offset=' + MEMES.offset;
  if (MEMES.tag) q += '&tag=' + encodeURIComponent(MEMES.tag);
  if (MEMES.q) q += '&q=' + encodeURIComponent(MEMES.q);
  return api('/api/socialV2/memes' + q).then(function (r) {
    MEMES.data = r;
    drawMemes();
  }).catch(function (err) {
    root.innerHTML = '<div class="card"><div class="empty">读取表情包图库失败：' + esc(err.message) + '</div></div>';
  });
}
function drawMemes() {
  var root = $('memesRoot');
  if (!root) return;
  var r = MEMES.data || {};
  var counts = r.counts || {};
  var moodOrder = ['happy', 'angry', 'sad', 'shy', 'confused', 'daily'];
  var tabs = '<button class="btn ' + (MEMES.tag ? 'ghost ' : '') + 'sm" data-act="memes-tab" data-tag="">全部 ' + n(r.total) + '</button>';
  moodOrder.forEach(function (m) {
    tabs += '<button class="btn ' + (MEMES.tag === m ? '' : 'ghost ') + 'sm" data-act="memes-tab" data-tag="' + m + '">' + esc(MEME_MOOD_LABEL[m] || m) + ' ' + n(counts[m] || 0) + '</button>';
  });
  var head = '<div class="card"><h3>表情包仓库 <span class="tag">' + n(r.total) + ' 张 · 停用 ' + n(r.disabled) + '</span></h3>'
    + '<div class="desc">图库：<span class="mono">' + esc(r.root || '') + '</span> · 「置顶」= 这个情绪优先发这张 · 「停用」= 她不会再用它</div>'
    + '<div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">' + tabs + '</div>'
    + '<div class="row" style="gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap">'
    + '<input id="memes-q" type="text" placeholder="搜说明 / 关键词 / 文件名" value="' + esc(MEMES.q) + '" style="flex:1;min-width:240px">'
    + '<button class="btn ghost sm" data-act="memes-search">搜索</button>'
    + '<span class="hint">共 ' + n(r.matched) + ' 张匹配</span>'
    + '</div></div>';
  var add = '<div class="card"><h3>添加表情包</h3>'
    + '<div class="row" style="gap:10px;align-items:flex-end;flex-wrap:wrap">'
    + '<label class="field" style="max-width:130px">情绪<select id="meme-tag">'
    + moodOrder.map(function (m) { return '<option value="' + m + '">' + esc(MEME_MOOD_LABEL[m] || m) + '（' + m + '）</option>'; }).join('')
    + '</select></label>'
    + '<label class="field" style="max-width:240px">说明（可选）<input id="meme-caption" type="text" placeholder="例如：比心 / 得意 / 无语"></label>'
    + '<label class="field" style="max-width:220px">关键词（可选）<input id="meme-keywords" type="text" placeholder="空格分隔"></label>'
    + '</div>'
    + '<div class="row" style="gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap">'
    + '<input id="meme-file" type="file" accept="image/*" multiple style="width:auto">'
    + '<button class="btn" data-act="memes-upload">上传文件</button>'
    + '<span class="hint" id="meme-msg"></span>'
    + '</div>'
    + '<div class="row" style="gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap">'
    + '<input id="meme-url" type="text" placeholder="粘贴图片链接：GitHub blob/raw 链接，或任意图片直链" style="flex:1;min-width:300px">'
    + '<button class="btn" data-act="memes-addurl">从链接添加</button>'
    + '</div>'
    + '<div class="hint" style="margin-top:8px">GitHub 直连不通时会自动改用 jsDelivr / ghproxy 镜像下载；单张上限 8MB。</div></div>';
  var cards = '';
  (r.items || []).forEach(function (m) {
    cards += '<div style="border:1px solid var(--border);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--surface)">'
      + '<img src="' + memesImgUrl(m.path) + '" loading="lazy" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:8px;background:var(--surface-3)">'
      + '<div class="hint" style="font-size:11px">' + esc(m.mood || m.tag) + ' · ' + (m.size ? Math.max(1, Math.round(m.size / 1024)) + 'KB' : '—') + (m.pinned ? ' · <b style="color:var(--accent)">置顶</b>' : '') + (m.enabled ? '' : ' · <b style="color:var(--warn)">已停用</b>') + '</div>'
      + '<div style="font-size:12px;line-height:1.4;height:34px;overflow:hidden" title="' + esc(m.caption) + '">' + esc(m.caption || m.file_name) + '</div>'
      + '<div class="row" style="gap:6px">'
      + '<button class="btn ghost sm" data-act="memes-toggle" data-path="' + esc(m.path) + '" data-enabled="' + (m.enabled ? 'true' : 'false') + '">' + (m.enabled ? '停用' : '启用') + '</button>'
      + '<button class="btn ghost sm" data-act="memes-pin" data-path="' + esc(m.path) + '" data-pinned="' + (m.pinned ? 'true' : 'false') + '">' + (m.pinned ? '取消置顶' : '置顶') + '</button>'
      + '<button class="btn ghost sm" data-act="memes-del" data-path="' + esc(m.path) + '" title="删除">删</button>'
      + '</div></div>';
  });
  var grid = '<div class="card"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px">' + (cards || '<div class="empty">没有匹配的表情包</div>') + '</div>'
    + '<div class="row" style="justify-content:space-between;margin-top:12px;align-items:center">'
    + '<button class="btn ghost sm" data-act="memes-page" data-dir="-1"' + (MEMES.offset <= 0 ? ' disabled' : '') + '>上一页</button>'
    + '<span class="hint">第 ' + (Math.floor(MEMES.offset / MEMES.limit) + 1) + ' 页 · 每页 ' + MEMES.limit + ' 张</span>'
    + '<button class="btn ghost sm" data-act="memes-page" data-dir="1"' + (MEMES.offset + MEMES.limit >= (r.matched || 0) ? ' disabled' : '') + '>下一页</button>'
    + '</div></div>';
  root.innerHTML = head + add + grid;
}
function memeFormFields() {
  var tag = (($('meme-tag') || {}).value || 'happy');
  return {
    tag: tag,
    caption: (($('meme-caption') || {}).value || '').trim(),
    keywords: (($('meme-keywords') || {}).value || '').trim()
  };
}
ACTIONS['memes-tab'] = function (el) { MEMES.tag = el.dataset.tag || ''; MEMES.offset = 0; loadMemes(); };
ACTIONS['memes-search'] = function () { MEMES.q = (($('memes-q') || {}).value || '').trim(); MEMES.offset = 0; loadMemes(); };
ACTIONS['memes-page'] = function (el) {
  var dir = Number(el.dataset.dir) || 0;
  var matched = (MEMES.data && MEMES.data.matched) || 0;
  MEMES.offset = Math.max(0, Math.min(Math.max(0, matched - 1), MEMES.offset + dir * MEMES.limit));
  loadMemes();
};
ACTIONS['memes-toggle'] = function (el) {
  var on = el.dataset.enabled !== 'true';
  el.disabled = true;
  api('/api/socialV2/memes/toggle', { method: 'POST', body: { path: el.dataset.path, enabled: on } })
    .then(function () { toast(on ? '已启用' : '已停用（她不会再用这张）'); return loadMemes(); })
    .catch(function (err) { toast(err.message, 'err'); el.disabled = false; });
};
ACTIONS['memes-pin'] = function (el) {
  var pin = el.dataset.pinned !== 'true';
  api('/api/socialV2/memes/pin', { method: 'POST', body: { path: el.dataset.path, pinned: pin } })
    .then(function () { toast(pin ? '已置顶：这个情绪优先发这张' : '已取消置顶'); return loadMemes(); })
    .catch(function (err) { toast(err.message, 'err'); });
};
ACTIONS['memes-del'] = function (el) {
  if (!confirm('从图库删除这张表情包？文件与索引都会删掉，不可恢复。')) return;
  api('/api/socialV2/memes/delete', { method: 'POST', body: { path: el.dataset.path } })
    .then(function () { toast('已删除'); return loadMemes(); })
    .catch(function (err) { toast(err.message, 'err'); });
};
ACTIONS['memes-upload'] = function () {
  var input = $('meme-file');
  var files = input && input.files ? Array.prototype.slice.call(input.files) : [];
  var msg = $('meme-msg');
  if (!files.length) { if (msg) msg.textContent = '先选图片文件'; return; }
  var form = memeFormFields();
  var job = Promise.resolve();
  var okCount = 0;
  files.forEach(function (f) {
    job = job.then(function () {
      return new Promise(function (resolve) {
        var reader = new FileReader();
        reader.onload = function () {
          var s = String(reader.result || '');
          var b64 = s.indexOf(',') >= 0 ? s.slice(s.indexOf(',') + 1) : s;
          api('/api/socialV2/memes/add', { method: 'POST', body: { tag: form.tag, caption: form.caption, keywords: form.keywords, filename: f.name, contentBase64: b64 } })
            .then(function () { okCount += 1; resolve(); })
            .catch(function (err) { toast(f.name + '：' + err.message, 'err'); resolve(); });
        };
        reader.onerror = function () { toast(f.name + '：读取失败', 'err'); resolve(); };
        reader.readAsDataURL(f);
      });
    });
  });
  job.then(function () {
    if (msg) msg.textContent = '已添加 ' + okCount + ' / ' + files.length + ' 张';
    toast('已添加 ' + okCount + ' 张表情包');
    return loadMemes();
  });
};
ACTIONS['memes-addurl'] = function () {
  var url = (($('meme-url') || {}).value || '').trim();
  var msg = $('meme-msg');
  if (!url) { if (msg) msg.textContent = '先粘贴图片链接'; return; }
  var form = memeFormFields();
  if (msg) msg.textContent = '下载中…';
  api('/api/socialV2/memes/add', { method: 'POST', body: { tag: form.tag, caption: form.caption, keywords: form.keywords, url: url } })
    .then(function (r) { if (msg) msg.textContent = '已添加：' + r.path; toast('已从链接添加'); return loadMemes(); })
    .catch(function (err) { if (msg) msg.textContent = '添加失败：' + err.message; toast(err.message, 'err'); });
};
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'memes-q') { ev.preventDefault(); ACTIONS['memes-search'](); }
});
// ── 插件（DSH profile 组合包）───────────────────────────────────────────
var PLUGINS = { data: null, timer: null, log: [] };
function renderPlugins() {
  $('view').innerHTML = '<div id="pluginsRoot"><div class="empty"><span class="spin"></span> 加载中…</div></div>';
  return loadPlugins();
}
function loadPlugins() {
  return api('/api/plugins').then(function (r) {
    PLUGINS.data = r;
    drawPlugins();
  }).catch(function (err) {
    var root = $('pluginsRoot');
    if (root) root.innerHTML = '<div class="card"><div class="empty">读取失败：' + esc(err.message) + '</div></div>';
  });
}
function pluginLogText() {
  return PLUGINS.log.join('\n');
}
function pluginJobBox() {
  var txt = pluginLogText();
  return '<pre class="output" id="plugin-log" style="max-height:260px;overflow:auto;margin-top:10px">' + esc(txt || '（安装日志会显示在这里）') + '</pre>';
}
function drawPlugins() {
  var root = $('pluginsRoot');
  if (!root) return;
  var r = PLUGINS.data || {};
  var deps = r.deps || [];
  var head = '<div class="card"><h3>插件 <span class="tag">' + deps.length + ' 个可管理 · 组合包 ' + ((r.bundles || []).length) + ' 个</span></h3>'
    + '<div class="desc">profile：<span class="mono">' + esc(r.profile || '') + '</span> · 装的是 DSH 组合包（桌面端插件市场同款），装完需要重启 DSH 才生效；重启会中断当前会话约 1 分钟。</div>'
    + '<div class="row" style="gap:10px;align-items:center;flex-wrap:wrap">'
    + '<input id="plugin-url" type="text" placeholder="粘贴链接：github.com/owner/repo 或 npm 包名" style="flex:1;min-width:320px">'
    + '<button class="btn" data-act="plugin-install">安装</button>'
    + '<button class="btn ghost" data-act="plugin-restart" title="重启 DSH 才会加载新插件">重启 DSH</button>'
    + '</div>'
    + '<div class="hint" style="margin-top:8px">支持 github.com/owner/repo（可带 /tree/分支，走 ghproxy/jsDelivr 镜像下载）和 npm 包名；安装时会写 profile/package.json 的 dsh.profile.bundles，旧文件自动备份。</div>'
    + pluginJobBox()
    + '</div>';
  var rows = '';
  deps.forEach(function (d) {
    var src = d.source ? '<a href="' + esc(d.source) + '" target="_blank" rel="noreferrer">' + esc(d.source) + '</a>' : '<span class="mono">' + esc(d.spec) + '</span>';
    rows += '<tr><td><div class="mono">' + esc(d.name) + '</div><div class="hint">' + esc(d.description || '') + '</div></td>'
      + '<td>' + esc(d.version || '—') + '</td>'
      + '<td style="max-width:260px;overflow:hidden;text-overflow:ellipsis">' + src + '</td>'
      + '<td style="white-space:nowrap">' + (d.hasBundle ? (d.enabled ? '<span class="badge accent">启用</span>' : '<span class="badge">关闭</span>') : '<span class="hint">非组合包</span>') + '</td>'
      + '<td style="white-space:nowrap">'
      + (d.hasBundle ? '<button class="btn ghost sm" data-act="plugin-bundle" data-name="' + esc(d.name) + '" data-enabled="' + (d.enabled ? 'true' : 'false') + '">' + (d.enabled ? '关闭' : '启用') + '</button> ' : '')
      + '<button class="btn ghost sm" data-act="plugin-remove" data-name="' + esc(d.name) + '">卸载</button>'
      + '</td></tr>';
  });
  var table = '<div class="card"><h3>已安装</h3><table><thead><tr><th style="width:36%">插件</th><th style="width:64px">版本</th><th style="width:200px">来源</th><th style="width:86px;white-space:nowrap">组合包</th><th style="width:118px;white-space:nowrap">操作</th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="5" class="hint">没有可管理的插件</td></tr>') + '</tbody></table></div>';
  root.innerHTML = head + table;
}
function pluginStartJob(kind, url) {
  PLUGINS.log = ['提交 ' + kind + '：' + url];
  drawPlugins();
  var body = kind === 'install' ? { url: url } : { name: url };
  var path = kind === 'install' ? '/api/plugins/install' : '/api/plugins/remove';
  api(path, { method: 'POST', body: body }).then(function (r) {
    pluginPoll(r.jobId);
  }).catch(function (err) {
    PLUGINS.log.push('❌ ' + err.message);
    drawPlugins();
    toast(err.message, 'err');
  });
}
function pluginPoll(jobId) {
  if (PLUGINS.timer) clearInterval(PLUGINS.timer);
  PLUGINS.timer = setInterval(function () {
    api('/api/plugins/job?id=' + encodeURIComponent(jobId)).then(function (r) {
      var job = r.job || {};
      PLUGINS.log = job.log || [];
      drawPlugins();
      if (job.status !== 'running') {
        clearInterval(PLUGINS.timer); PLUGINS.timer = null;
        toast(job.status === 'done' ? '完成，重启 DSH 后生效' : '失败，请看日志', job.status === 'done' ? undefined : 'err');
        loadPlugins();
      }
    }).catch(function () { clearInterval(PLUGINS.timer); PLUGINS.timer = null; });
  }, 1500);
}
ACTIONS['plugin-install'] = function () {
  var url = (($('plugin-url') || {}).value || '').trim();
  if (!url) { toast('先粘贴链接', 'err'); return; }
  var looksLikeSpec = /^(https?:\/\/|github:)/i.test(url) || /^(@[a-z0-9][\w.-]*\/)?[a-z0-9][\w.-]*(@[\w.^~*-]+)?$/i.test(url);
  if (!looksLikeSpec) { toast('格式不对：github.com/owner/repo 或 npm 包名', 'err'); return; }
  pluginStartJob('install', url);
};
ACTIONS['plugin-remove'] = function (el) {
  if (!confirm('卸载 ' + el.dataset.name + '？会从 profile 里移除依赖和组合包启用项。')) return;
  pluginStartJob('remove', el.dataset.name);
};
ACTIONS['plugin-bundle'] = function (el) {
  var on = el.dataset.enabled !== 'true';
  api('/api/plugins/bundle', { method: 'POST', body: { name: el.dataset.name, enabled: on } })
    .then(function () { toast(on ? '已启用（重启 DSH 后生效）' : '已关闭（重启 DSH 后生效）'); return loadPlugins(); })
    .catch(function (err) { toast(err.message, 'err'); });
};
ACTIONS['plugin-restart'] = function () {
  if (!confirm('重启 DSH？当前桌面会话会中断约 1 分钟（桌面端会自动重新拉起），确定现在重启？')) return;
  api('/api/plugins/restart-dsh', { method: 'POST', body: {} })
    .then(function (r) { toast((r && r.hint) || '已请求重启 DSH'); })
    .catch(function (err) { toast(err.message, 'err'); });
};
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  try { fn(el); } catch (err) { toast(err.message, 'err'); }
});
document.addEventListener('change', function (ev) {
  if (!ev.target) return;
  if (ev.target.id === 'role-silent') {
    var onSilent = !!ev.target.checked;
    api('/api/role-mode', { method: 'POST', body: { mode: onSilent ? 'silent' : 'active' } })
      .then(function () { toast(onSilent ? '已切到静默：群里不接话，只回主人私聊' : '已恢复活跃：群里会正常接话'); return refreshAll(); })
      .catch(function (err) { toast('切换失败：' + err.message, 'err'); ev.target.checked = !onSilent; });
    return;
  }
  if (ev.target.id !== 'sleep-force-awake') return;
  var msg = $('sleep-msg');
  var on = !!ev.target.checked;
  if (msg) msg.textContent = on ? '正在打开免睡眠…' : '正在关闭免睡眠…';
  api('/api/socialV2/sleep-toggle', { method: 'POST', body: { forceAwake: on } })
    .then(function () { toast(on ? '免睡眠已打开，随时能叫醒她' : '免睡眠已关闭，到点照常睡'); return refreshAll(); })
    .catch(function (err) { toast('切换失败：' + err.message, 'err'); if (msg) msg.textContent = err.message; ev.target.checked = !on; });
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter') return;
  var id = ev.target && ev.target.id;
  if (id === 'gate-token') { ev.preventDefault(); $('gate-ok').click(); }
  if (id === 'kb-q') { ev.preventDefault(); ACTIONS['kb-search'](); }
  if (id === 'mem-key') { ev.preventDefault(); ACTIONS['mem-load'](); }
});

// ── 初始化 ──────────────────────────────────────────────────────────────
$('gate-ok').addEventListener('click', function () {
  var v = ($('gate-token').value || '').trim();
  if (!v) { $('gate-msg').textContent = '令牌不能为空'; return; }
  state.token = v;
  if (!saveToken(v)) $('gate-msg').textContent = '浏览器不允许记住令牌（隐私模式？）—— 建议把带 token 的地址收藏起来用';
  hideGate();
  refreshAll();
});
$('btn-refresh').addEventListener('click', refreshAll);
document.querySelectorAll('.nav-item').forEach(function (b) {
  b.addEventListener('click', function () { loadView(b.dataset.view); });
});
function boot() {
  var params = new URLSearchParams(location.search);
  var fromUrl = params.get('token');
  var stored = '';
  try { stored = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { stored = ''; }
  if (!stored) stored = readCookie(adminCookieName());
  state.token = fromUrl || stored;
  if (!state.token) { showGate(); return; }
  // 三层记忆：URL / localStorage / cookie。能存下来才把地址栏里的 token 去掉，
  // 否则刷新会丢令牌（隐私模式、被清理的浏览器）。桥接侧也认这个 cookie。
  var persisted = saveToken(state.token);
  if (fromUrl && persisted) {
    params.delete('token');
    try { history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params.toString() : '')); } catch (e) {}
  }
  hideGate();
  refreshAll();
  initAutoRefresh();
}
boot();
})();
</script>
